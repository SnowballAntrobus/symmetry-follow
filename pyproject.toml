[project]
name = "decal-lecture-2"
version = "0.1.0"
description = "Calendar-month representation measurements for Tinker-compatible Qwen models"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28",
    "tinker>=0.30",
    # The default local extraction uses one decoder block at a time on the CPU.
    # On Linux, use the CPU wheel rather than downloading unused CUDA libraries.
    "torch>=2.0",
]

[project.optional-dependencies]
training = ["tinker-cookbook==0.5.7"] # Rendering for month_swap training.
months = [
    "huggingface-hub>=1.0",
    "numpy>=2",
    "safetensors>=0.8",
    "transformers==5.5.4",
]

[tool.uv]
# This is a folder of scripts, not an installable package.
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
